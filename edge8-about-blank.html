<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Edge about:blank navigation spoof</title></head>
<body>
<h3>Edge #8: about:blank bridge navigation (teknik video)</h3>
<p>Klik tombol. Pattern: attacker → about:blank → target. Perhatikan address bar transisi.</p>
<button onclick="go()">Mulai</button>
<script>
function go(){
  var x = window.open("about:blank", "_blank");
  setTimeout(function(){
    x.location = "https://www.bing.com";
  }, 1200);
}
</script>
</body>
</html>
